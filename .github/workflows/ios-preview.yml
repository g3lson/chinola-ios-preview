# Vista previa del Chinola nativo (SwiftUI) en el simulador de iOS.
#
# No firma ni sube a TestFlight: solo compila para el simulador, arranca un
# iPhone, lanza la app y guarda una captura como artefacto. Así se puede ver
# cómo va quedando la versión nativa sin un Mac y sin tocar la firma de Apple.
name: iOS preview (SwiftUI)

on:
  push:
    branches: [main]
    paths:
      - "swiftui/**"
      - ".github/workflows/ios-preview.yml"
  workflow_dispatch:

jobs:
  preview:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      SIM: iPhone 15
      APP_ID: do.com.fente.chinolaswift
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas de Xcode
        run: |
          # XcodeGen genera el proyecto en el formato de Xcode 16 (objectVersion 77),
          # así que hay que seleccionar un Xcode 16 en el runner (el macos-14 usa 15 por defecto).
          XC="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          brew install xcodegen

      - name: Generar el proyecto de Xcode
        working-directory: swiftui
        run: xcodegen generate

      - name: Compilar para el simulador
        working-directory: swiftui
        run: |
          set -o pipefail
          xcodebuild build \
            -project Chinola.xcodeproj \
            -scheme Chinola \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Arrancar el iPhone simulado y capturar
        working-directory: swiftui
        run: |
          set -e
          APP="$(find dd/Build/Products -name '*.app' -type d | head -1)"
          echo "App: $APP"
          # Elegir un iPhone disponible (el nombre por defecto cambia entre versiones de Xcode).
          DEV="$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][^(]*' | head -1 | xargs)"
          [ -z "$DEV" ] && DEV="$SIM"
          echo "Simulador: $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || true
          xcrun simctl install "$DEV" "$APP"
          mkdir -p capturas
          # Cada captura: "VARS|nombre". Las VARS se pasan a la app con el prefijo
          # SIMCTL_CHILD_ (así simctl las inyecta al proceso).
          CAPTURAS=(
            "CHINOLA_TAB=0|0-resumen"
            "CHINOLA_TAB=1|1-movs"
            "CHINOLA_TAB=2|2-cuentas"
            "CHINOLA_TAB=3|3-plan"
            "CHINOLA_TAB=3 CHINOLA_PLANSEG=1|4-metas"
            "CHINOLA_TAB=4|5-perfil"
            "CHINOLA_SCREEN=nuevo|6-nuevo-movimiento"
            "CHINOLA_SCREEN=acciones|7-agregar"
            "CHINOLA_SCREEN=nueva-cuenta|8-nueva-cuenta"
            "CHINOLA_SCREEN=filtro|9-filtro"
            "CHINOLA_SCREEN=apariencia|10-apariencia"
            "CHINOLA_SCREEN=header|11-header"
            "CHINOLA_SCREEN=tendencia|12-tendencia"
            "CHINOLA_SCREEN=transferencia|13-transferencia"
            "CHINOLA_SCREEN=prestamo|14-prestamo"
            "CHINOLA_SCREEN=abono|15-abono"
            "CHINOLA_SCREEN=aporte|16-aporte"
            "CHINOLA_SCREEN=meta|17-meta"
            "CHINOLA_SCREEN=tarjeta|18-tarjeta"
            "CHINOLA_SCREEN=pago-tarjeta|19-pago-tarjeta"
            "CHINOLA_SCREEN=categoria|20-categoria"
            "CHINOLA_SCREEN=libretas|21-libretas"
            "CHINOLA_SCREEN=libreta-detalle|22-libreta-detalle"
            "CHINOLA_SCREEN=idioma|23-idioma"
            "CHINOLA_SCREEN=notificaciones|24-notificaciones"
            "CHINOLA_SCREEN=editar-nombre|25-editar-nombre"
            "CHINOLA_SCREEN=correo|26-correo"
            "CHINOLA_SCREEN=clave|27-clave"
            "CHINOLA_SCREEN=eliminar-cuenta|28-eliminar-cuenta"
            "CHINOLA_SCREEN=det-cuenta|29-detalle-cuenta"
            "CHINOLA_SCREEN=det-prestamo|30-detalle-prestamo"
            "CHINOLA_SCREEN=det-tarjeta|31-detalle-tarjeta"
            "CHINOLA_SCREEN=det-meta|32-detalle-meta"
            "CHINOLA_SCREEN=det-movimiento|33-detalle-movimiento"
            "CHINOLA_SCREEN=bienvenida|34-bienvenida"
            "CHINOLA_SCREEN=registro|35-registro"
            "CHINOLA_SCREEN=login|36-login"
            "CHINOLA_SCREEN=selector|37-selector-libreta"
            "CHINOLA_SCREEN=agregar-libreta|38-agregar-libreta"
            "CHINOLA_SCREEN=invitacion|39-invitacion"
            "CHINOLA_SCREEN=mi-cuenta|40-mi-cuenta"
            "CHINOLA_SCREEN=seguridad|41-seguridad"
            "CHINOLA_SCREEN=integraciones|42-integraciones"
            "CHINOLA_SCREEN=tour|43-tour"
          )
          for spec in "${CAPTURAS[@]}"; do
            vars="${spec%%|*}"; name="${spec##*|}"
            xcrun simctl terminate "$DEV" "$APP_ID" 2>/dev/null || true
            pre=""
            for kv in $vars; do pre="$pre SIMCTL_CHILD_$kv"; done
            env $pre xcrun simctl launch "$DEV" "$APP_ID"
            sleep 4
            xcrun simctl io "$DEV" screenshot "capturas/${name}.png"
            echo "Captura ${name} tomada."
          done
          ls -la capturas

      - name: Subir la captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: swiftui/capturas/*.png
          if-no-files-found: warn
