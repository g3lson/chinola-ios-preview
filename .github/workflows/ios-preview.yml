# Vista previa del Chinola nativo (SwiftUI) en el simulador de iOS.
#
# No firma ni sube a TestFlight: solo compila para el simulador, arranca un
# iPhone, lanza la app y guarda una captura como artefacto. Así se puede ver
# cómo va quedando la versión nativa sin un Mac y sin tocar la firma de Apple.
name: iOS preview (SwiftUI)

on:
  push:
    branches: [main]
    paths:
      - "swiftui/**"
      - ".github/workflows/ios-preview.yml"
  workflow_dispatch:

jobs:
  preview:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      SIM: iPhone 15
      APP_ID: do.com.fente.chinolaswift
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas de Xcode
        run: |
          # XcodeGen genera el proyecto en el formato de Xcode 16 (objectVersion 77),
          # así que hay que seleccionar un Xcode 16 en el runner (el macos-14 usa 15 por defecto).
          XC="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          brew install xcodegen

      - name: Generar el proyecto de Xcode
        working-directory: swiftui
        run: xcodegen generate

      - name: Compilar para el simulador
        working-directory: swiftui
        run: |
          set -o pipefail
          xcodebuild build \
            -project Chinola.xcodeproj \
            -scheme Chinola \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Arrancar el iPhone simulado y capturar
        working-directory: swiftui
        run: |
          set -e
          APP="$(find dd/Build/Products -name '*.app' -type d | head -1)"
          echo "App: $APP"
          # Elegir un iPhone disponible (el nombre por defecto cambia entre versiones de Xcode).
          DEV="$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][^(]*' | head -1 | xargs)"
          [ -z "$DEV" ] && DEV="$SIM"
          echo "Simulador: $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || true
          xcrun simctl install "$DEV" "$APP"
          mkdir -p capturas
          # Arrancar la app en cada pestaña (CHINOLA_TAB) y capturar cada pantalla.
          NOMBRES=(resumen movs cuentas plan perfil)
          for i in 0 1 2 3 4; do
            xcrun simctl terminate "$DEV" "$APP_ID" 2>/dev/null || true
            SIMCTL_CHILD_CHINOLA_TAB=$i xcrun simctl launch "$DEV" "$APP_ID"
            sleep 4
            xcrun simctl io "$DEV" screenshot "capturas/${i}-${NOMBRES[$i]}.png"
            echo "Captura ${NOMBRES[$i]} tomada."
          done
          ls -la capturas

      - name: Subir la captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: swiftui/capturas/*.png
          if-no-files-found: warn
