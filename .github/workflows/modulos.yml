name: ¿Arrancan los módulos dentro de la app?

# Una app Capacitor de fábrica con una página de tres líneas, para responder una
# sola pregunta: ¿se ejecuta un <script type="module"> cuando la app está
# empaquetada (capacitor://localhost), o lo bloquea el navegador?
#
# Importa porque su manejador de archivos solo manda cabeceras de CORS en live
# reload, y un módulo se pide SIEMPRE en modo CORS. Si la respuesta es que no
# arranca, esa es la causa de que una app entera se quede en blanco sin dar un
# solo error: el error es del navegador, no del código.
#
# Aquí no va nada de Chinola: solo la pregunta.

on:
  workflow_dispatch:
  push:
    paths: ['hibrido/www/probe/**', '.github/workflows/modulos.yml']

jobs:
  probar:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Montar una app Capacitor de fábrica con la página de prueba
        run: |
          mkdir -p sonda/www && cd sonda
          cp -R ../hibrido/www/probe/* www/
          npm init -y >/dev/null
          npm i @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest >/dev/null 2>&1
          cat > capacitor.config.json <<'JSON'
          { "appId": "do.com.fente.sondamodulos", "appName": "Sonda", "webDir": "www",
            "server": { "iosScheme": "capacitor" } }
          JSON
          npx cap add ios
          npx cap sync ios
          # Y la segunda mitad de la pregunta: con el webview TAPADO por una
          # vista nativa opaca desde el primer fotograma, como hace Chinola
          # —todas sus pantallas son nativas—. Si WebKit suspende el JavaScript
          # de un webview que no se ve, aquí el módulo no corre y en la sonda de
          # antes sí, que es la diferencia que queda por explicar.
          # El SceneDelegate YA existe en el proyecto que genera Capacitor: se
          # SOBRESCRIBE. Añadirlo otra vez lo dejaba duplicado, Xcode se saltaba
          # uno de los dos y la tapa nunca llegaba a aplicarse —que es por lo que
          # la primera vez salió el mismo resultado que sin tapar—.
          cp ../hibrido/sonda-tapada/SceneDelegate.swift ios/App/App/SceneDelegate.swift
          cp ../hibrido/sonda-tapada/ViewController.swift ios/App/App/ViewController.swift
          gem install xcodeproj --no-document --quiet
          # Solo ViewController es nuevo. Y se comprueba que no acabe duplicado.
          ruby -e "
            require 'xcodeproj'
            p = Xcodeproj::Project.open('ios/App/App.xcodeproj')
            g = (p.main_group['App'] || p.main_group)
            t = p.targets.first
            ya = t.source_build_phase.files.map { |f| f.file_ref&.path }.compact
            abort('ViewController ya estaba: revisar') if ya.include?('ViewController.swift')
            t.add_file_references([g.new_file('ViewController.swift')])
            p.save
            puts 'fuentes: ' + t.source_build_phase.files.map { |f| f.file_ref&.path }.compact.sort.join(', ')
          "
          # La clave está ANIDADA dentro del manifiesto de escena, no en la raíz:
          # borrándola de la raíz no se borraba nada y seguía mandando el
          # storyboard, que monta el controlador de Capacitor y no el nuestro.
          # Por eso la tapa no aparecía.
          RUTA=':UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneStoryboardFile'
          /usr/libexec/PlistBuddy -c "Delete $RUTA" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print $RUTA" ios/App/App/Info.plist 2>/dev/null \
            && { echo '::error::el storyboard sigue puesto: la prueba no valdría'; exit 1; } || echo 'storyboard fuera ✓'
          echo "=== quién monta la ventana ==="
          /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest" ios/App/App/Info.plist 2>/dev/null || echo "(sin manifiesto de escena)"
          echo "=== lo que se empaqueta ==="; ls -R ios/App/App/public | head -20

      - name: Compilar para simulador
        run: |
          set -o pipefail
          cd sonda
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20

      - name: Lanzar y fotografiar la respuesta
        run: |
          cd sonda
          APP=$(find build/Build/Products -name "App.app" -maxdepth 3 | head -1)
          # El runtime MÁS NUEVO, que es donde está el comportamiento que se
          # quiere comprobar: en uno viejo la respuesta podría ser otra.
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "SimRuntime.iOS" in r["identifier"]]; rs.sort(key=lambda r:[int(n) for n in r["version"].split(".")]); print(rs[-1]["identifier"], rs[-1]["version"])')
          RT_ID=$(echo "$RT" | cut -d' ' -f1); RT_VER=$(echo "$RT" | cut -d' ' -f2)
          echo "runtime: iOS $RT_VER"
          MODELO=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; ns=[d["name"] for d in json.load(sys.stdin)["devicetypes"]]; print(next((q for q in ["iPhone 17 Pro","iPhone 16 Pro","iPhone 16"] if q in ns), "iPhone 16 Pro"))')
          xcrun simctl delete "sonda" 2>/dev/null || true
          UDID=$(xcrun simctl create "sonda" "$MODELO" "$RT_ID")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" do.com.fente.sondamodulos || true
          # La primera foto es el CONTROL: si no se ve la tapa, la prueba no
          # vale y el resultado de la segunda no dice nada.
          sleep 6
          xcrun simctl io "$UDID" screenshot "1-con-el-arreglo-ios$RT_VER.png" || true
          echo "=== ¿se montó nuestro controlador? ==="
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'eventMessage CONTAINS "SONDA"' --style compact 2>/dev/null | head -10 || true
          sleep 8
          xcrun simctl io "$UDID" screenshot "2-respuesta-ios$RT_VER.png" || true
          echo "=== lo que dijo el webview ==="
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "App"' --style compact 2>/dev/null | grep -iE "module|cors|script|blocked" | head -20 || true

      - name: Subir la respuesta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respuesta
          path: sonda/*.png
