name: Híbrido simulador (captura)

# Reproduce el ARRANQUE de la app real (contenedor Capacitor: SceneDelegate +
# storyboard + manifest de escena) en un simulador y saca capturas. Repo público
# = Actions gratis. Solo boilerplate: NADA de código propietario.

on:
  workflow_dispatch:
  push:
    paths:
      - 'hibrido/**'
      - '.github/workflows/hibrido-sim.yml'

jobs:
  sim:
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: hibrido
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Capacitor y generar iOS (por defecto)
        run: |
          npm install
          npx cap add ios
          echo "=== swift generados ==="; ls ios/App/App/*.swift || true

      - name: Superponer subclase + barra (patrón canónico, sin storyboard)
        run: |
          # Reemplaza el SceneDelegate por el que crea a mano una SUBCLASE con
          # barra nativa encima. NO se inyecta UISceneStoryboardFile (canónico).
          cp overlay/SceneDelegate.swift ios/App/App/SceneDelegate.swift
          /usr/libexec/PlistBuddy -c "Delete :UISceneStoryboardFile" ios/App/App/Info.plist 2>/dev/null || true
          echo "=== SceneDelegate final ==="; head -5 ios/App/App/SceneDelegate.swift

      - name: Compilar para simulador
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Lanzar en el simulador + capturas
        run: |
          set -e
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" do.com.fente.chinolasim || true
          sleep 2;  xcrun simctl io "$UDID" screenshot cap-01-web.png || true
          sleep 6;  xcrun simctl io "$UDID" screenshot cap-02-nativo.png || true

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-hibrido
          path: hibrido/cap-*.png

          if-no-files-found: warn
