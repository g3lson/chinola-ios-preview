name: Híbrido simulador (captura)

# Reproduce el ARRANQUE de la app real (contenedor Capacitor: SceneDelegate +
# storyboard + manifest de escena) en un simulador y saca capturas. Repo público
# = Actions gratis. Solo boilerplate: NADA de código propietario.

# EL EMPUJÓN YA NO LO DESPIERTA, A PROPÓSITO.
#
# Los cuatro bancos miran los mismos archivos, así que cada empujón lanzaba los
# cuatro y los cuatro se peleaban por el único runner de macOS: tres se
# quedaban en cola y había que cancelarlos a mano para que el que hacía falta
# cogiera sitio. Treinta minutos de espera por una comprobación que nadie iba a
# mirar.
#
# Se lanza cuando se pide (`gh workflow run`), que es como se usa de verdad.
on:
  workflow_dispatch:

jobs:
  sim:
    runs-on: macos-15   # Apple Silicon (arm64), como el device: evita el segfault
    timeout-minutes: 40  # de @Published del simulador x86_64
    defaults:
      run:
        working-directory: hibrido
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Usar el Xcode más nuevo (para el SDK de iOS 26 / Liquid Glass)
        run: |
          ls /Applications | grep -i "^Xcode" || true
          NUEVO=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "seleccionando: $NUEVO"
          sudo xcode-select -s "$NUEVO/Contents/Developer"
          xcodebuild -version
          echo "=== SDKs iOS ==="; xcodebuild -showsdks | grep -i "iphoneos\|simulator" || true

      - name: Instalar Capacitor y generar iOS (por defecto)
        run: |
          npm install
          npx cap add ios
          echo "=== swift generados ==="; ls ios/App/App/*.swift || true

      - name: Superponer arranque + UI nativa real (barra + Movimientos)
        run: |
          cp overlay/SceneDelegate.swift ios/App/App/SceneDelegate.swift
          # TODOS los Swift de la app, sin lista a mano.
          #
          # Aquí había siete nombres escritos. La app ya lleva diecisiete, y el
          # banco fallaba con «cannot find type CNTarjetasGrafico in scope»: no
          # es un fallo de la app, es del banco. Una lista que hay que acordarse
          # de actualizar miente el día que te olvidas, que es justo el día que
          # la necesitas.
          #
          # Va el controlador de la app REAL también: aquí no se usa —el banco
          # tiene el suyo—, pero se COMPILA, y son mil líneas que si no las
          # miraría solo Codemagic, donde un fallo cuesta una compilación
          # entera. SceneDelegate no se copia del overlay: el de arriba es el
          # del banco, que es el que quita el storyboard.
          for f in overlay/*.swift; do
            n=$(basename "$f")
            case "$n" in AppDelegate.swift|SceneDelegate.swift) continue;; esac
            cp "$f" "ios/App/App/$n"
          done
          # Una tipografía de la marca (variable) para comprobar que se registra
          # y que el peso del eje «wght» llega. En la app van las diez.
          cp -R overlay/Fuentes ios/App/App/Fuentes
          echo "Swift de la app: $(ls ios/App/App/*.swift | wc -l | tr -d ' ')"
          gem install xcodeproj --no-document --quiet
          # Y al proyecto, los que estén: se leen del disco, no de una lista.
          ruby -e "
            require 'xcodeproj'
            p = Xcodeproj::Project.open('ios/App/App.xcodeproj')
            g = (p.main_group['App'] || p.main_group)
            t = p.targets.first
            ya = t.source_build_phase.files.map { |f| f.file_ref&.path }.compact
            Dir['ios/App/App/*.swift'].map { |f| File.basename(f) }.sort.each do |n|
              next if ya.include?(n)
              puts \"  + #{n}\"
              t.add_file_references([g.new_file(n)])
            end
            r = g.new_reference('Fuentes'); r.set_last_known_file_type('folder'); t.add_resources([r])
            p.save
          "
          /usr/libexec/PlistBuddy -c "Delete :UISceneStoryboardFile" ios/App/App/Info.plist 2>/dev/null || true
          echo "=== archivos en el proyecto ==="; grep -cE "ChinolaNativo.swift|NativoPlugin.swift" ios/App/App.xcodeproj/project.pbxproj

      - name: Compilar para simulador
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Lanzar en el simulador + capturas
        run: |
          set -e
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          # OJO: `simctl list devices | head -1` coge el PRIMER iPhone que aparece,
          # y simctl ordena los runtimes de menor a mayor. El runner trae iOS 18
          # instalado además del 26, así que eso arrancaba un iPhone con iOS 18:
          # la app compilaba contra el SDK 26 pero corría en 18, sin Liquid Glass,
          # y las capturas no se parecían a un build de verdad. Ahora se crea el
          # dispositivo sobre el runtime más nuevo, a mano.
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "SimRuntime.iOS" in r["identifier"]]; rs.sort(key=lambda r:[int(n) for n in r["version"].split(".")]); print(rs[-1]["identifier"], rs[-1]["version"])')
          RT_ID=${RT% *}; RT_VER=${RT#* }
          echo "runtime elegido: iOS $RT_VER ($RT_ID)"
          case "$RT_VER" in 26*|27*) : ;; *) echo "::error::el runtime más nuevo es iOS $RT_VER: no hay Liquid Glass"; exit 1 ;; esac
          MODELO=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; ns=[d["name"] for d in json.load(sys.stdin)["devicetypes"]]; print(next((q for q in ["iPhone 17 Pro","iPhone 16 Pro","iPhone 16"] if q in ns), "iPhone 16 Pro"))')
          echo "modelo: $MODELO"
          xcrun simctl delete "cn-capturas" 2>/dev/null || true
          UDID=$(xcrun simctl create "cn-capturas" "$MODELO" "$RT_ID")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl ui "$UDID" appearance light || true
          # Una pantalla por lanzamiento: la app lee CNPANTALLA y monta esa. Así
          # cada captura es la que se pidió, sin depender de tiempos.
          # El identificador, SACADO DE LA CONFIGURACIÓN y no escrito aquí.
          #
          # Estaba escrito a mano: `do.com.fente.chinolasim`. El día que la
          # configuración pasó a ser la de la app —`do.com.fente.chinola`— el
          # lanzamiento dejó de encontrar nada, el `|| true` se tragó el error, y
          # las cinco capturas salieron siendo el ESCRITORIO del iPhone. El banco
          # decía «success» y no había mirado la app ni una vez.
          ID=$(node -p "require('./capacitor.config.json').appId")
          echo "identificador: $ID"
          # El escritorio, ANTES de arrancar nada. Es contra esto contra lo que
          # se comprueba luego que las capturas tengan la app dentro.
          xcrun simctl io "$UDID" screenshot "cap-0-escritorio.png"
          n=0
          for P in cuentas cta-grafica tema-oscuro plan sec-todo; do
            n=$((n+1))
            xcrun simctl terminate "$UDID" "$ID" 2>/dev/null || true
            # SIN `|| true`: si no arranca, esto tiene que fallar. Un banco que
            # se traga el fallo del arranque es un banco que siempre pasa.
            SIMCTL_CHILD_CNPANTALLA="$P" xcrun simctl launch "$UDID" "$ID"
            sleep 6
            xcrun simctl io "$UDID" screenshot "cap-$n-$P.png"
          done
          # Y que la app SIGA VIVA al final. Puede arrancar y caerse a los dos
          # segundos: la captura sale del escritorio igual, y el arranque no dio
          # error porque el proceso llegó a existir.
          if ! xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -qi "$ID"; then
            echo "::error::la app arrancó y se cayó: las capturas son del escritorio"
            VIVA=no
          else
            VIVA=si
          fi
          echo "=== volcado de la barra ==="
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'eventMessage CONTAINS "CNDUMP"' --style compact 2>/dev/null | head -60 || true
          echo "=== ¿sigue vivo el proceso? ==="
          xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i chinolasim || echo "(el proceso NO está vivo → crasheó)"
          echo "=== crash reports ==="
          sleep 2
          find ~/Library/Logs/DiagnosticReports -name "App-*.ips" 2>/dev/null | sort | tail -1 | while read f; do echo "--- $f ---"; sed -n '1,80p' "$f"; done
          cp ~/Library/Logs/DiagnosticReports/App-*.ips crash.ips 2>/dev/null || true

          # Y LA COMPROBACIÓN QUE FALTABA: que en las fotos salga la app.
          echo "=== ¿sale la app en las capturas? ==="
          python3 ../sondas/hay-app-en-la-foto.py
          [ "$VIVA" = si ]

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-hibrido
          path: |
            hibrido/cap-*.png
            hibrido/crash.ips

          if-no-files-found: warn
