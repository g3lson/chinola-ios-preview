name: El controlador REAL de Chinola, ejecutándose

# El otro banco de pruebas monta su propio `TestVC`: el controlador de verdad se
# compilaba pero nunca se ejecutaba. Y el fallo que perseguimos —la app abre en
# blanco— está justo en lo que ese controlador le hace al webview al arrancar.
#
# Aquí se ejecuta DE VERDAD, con una página mínima que dice en pantalla si su
# JavaScript llegó a correr. Nada del código web de Chinola: solo la pregunta.

on:
  workflow_dispatch:
  push:
    paths: ['hibrido/real/**', 'hibrido/app/**', 'hibrido/app-clasico/**', 'hibrido/overlay/**', '.github/workflows/real.yml']

jobs:
  correr:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El Xcode por defecto de macos-15 es el 16.4 y no compila lo nativo de
      # Chinola, que usa cosas de iOS 26. El mismo paso que el otro banco.
      - name: Usar el Xcode más nuevo
        run: |
          NUEVO=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$NUEVO/Contents/Developer"
          xcodebuild -version

      - name: Montar la app con el controlador real
        run: |
          mkdir -p app/www && cd app
          # LA APP DE VERDAD, no una página de juguete. La de juguete ya dijo
          # lo que podía decir: con el controlador real sus módulos SÍ corren.
          # Lo que falta por saber es si la que abre en blanco en el teléfono
          # abre en blanco aquí — y si abre, su propio cartel dice por qué.
          cp -R ../hibrido/app/* www/
          npm init -y >/dev/null
          npm i @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest >/dev/null 2>&1
          # LA MISMA CONFIGURACIÓN QUE LA APP, no una de juguete.
          #
          # El banco traía la suya, mínima, y por eso no veía el fallo que de
          # verdad tenía el usuario: la app lleva `launchAutoHide` en la
          # pantalla de arranque, y el banco no. Con la de juguete el arranque
          # se quitaba solo y todo parecía ir bien; en el teléfono se quedaba
          # puesto, crema y liso, tapando la app entera. Un banco que no
          # reproduce la configuración no reproduce nada.
          cp ../hibrido/capacitor.config.json capacitor.config.json
          npx cap add ios
          npx cap sync ios

          # TODOS los Swift de la app, sin lista a mano.
          #
          # Aquí había siete nombres escritos, y la app ya tiene diecisiete: el
          # banco compilaba una app a la que le faltaban diez ficheros y fallaba
          # con «cannot find IALocalPlugin in scope», que no es un fallo de la
          # app sino del banco. Un banco con una lista que hay que acordarse de
          # actualizar es un banco que miente el día que te olvidas, y ese es
          # justo el día que lo necesitas.
          #
          # AppDelegate y SceneDelegate NO se copian del overlay: los pone
          # Capacitor al crear el proyecto y el de escena lo manda el banco
          # (`hibrido/real/`), que es el que quita el storyboard.
          for f in ../hibrido/overlay/*.swift; do
            n=$(basename "$f")
            case "$n" in AppDelegate.swift|SceneDelegate.swift) continue;; esac
            cp "$f" "ios/App/App/$n"
          done
          cp -R ../hibrido/overlay/Fuentes ios/App/App/Fuentes
          cp ../hibrido/real/SceneDelegate.swift ios/App/App/SceneDelegate.swift
          echo "Swift de la app: $(ls ios/App/App/*.swift | wc -l | tr -d ' ')"

          gem install xcodeproj --no-document --quiet
          # Y al proyecto, los que estén: se leen del disco, no de una lista.
          ruby -e "
            require 'xcodeproj'
            p = Xcodeproj::Project.open('ios/App/App.xcodeproj')
            g = (p.main_group['App'] || p.main_group)
            t = p.targets.first
            ya = t.source_build_phase.files.map { |f| f.file_ref&.path }.compact
            Dir['ios/App/App/*.swift'].map { |f| File.basename(f) }.sort.each do |n|
              next if ya.include?(n)
              puts \"  + #{n}\"
              t.add_file_references([g.new_file(n)])
            end
            r = g.new_reference('Fuentes'); r.set_last_known_file_type('folder'); t.add_resources([r])
            p.save
          "
          # Sin storyboard: manda nuestro SceneDelegate, como en la app.
          RUTA=':UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneStoryboardFile'
          /usr/libexec/PlistBuddy -c "Delete $RUTA" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print $RUTA" ios/App/App/Info.plist 2>/dev/null \
            && { echo '::error::el storyboard sigue puesto'; exit 1; } || echo 'storyboard fuera ✓'
          /usr/libexec/PlistBuddy -c "Delete :UIMainStoryboardFile" ios/App/App/Info.plist 2>/dev/null || true

      - name: Compilar
        run: |
          set -o pipefail
          cd app
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcode.log | tail -25
          # Y si falló, los errores DE VERDAD. `tail -25` se come justo lo que
          # hace falta —el motivo va mucho antes del resumen final— y eso
          # cuesta una vuelta entera de integración continua cada vez.
          if ! grep -q "BUILD SUCCEEDED" /tmp/xcode.log; then
            echo "=== los errores ==="
            grep -E "error:|warning: .*deprecat" /tmp/xcode.log | head -40
            exit 65
          fi

      - name: Ejecutar y fotografiar
        run: |
          cd app
          APP=$(find build/Build/Products -name "App.app" -maxdepth 3 | head -1)
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "SimRuntime.iOS" in r["identifier"]]; rs.sort(key=lambda r:[int(n) for n in r["version"].split(".")]); print(rs[-1]["identifier"], rs[-1]["version"])')
          RT_ID=$(echo "$RT" | cut -d' ' -f1); RT_VER=$(echo "$RT" | cut -d' ' -f2)
          MODELO=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; ns=[d["name"] for d in json.load(sys.stdin)["devicetypes"]]; print(next((q for q in ["iPhone 17 Pro","iPhone 16 Pro","iPhone 16"] if q in ns), "iPhone 16 Pro"))')
          echo "iOS $RT_VER · $MODELO"
          xcrun simctl delete "real" 2>/dev/null || true
          UDID=$(xcrun simctl create "real" "$MODELO" "$RT_ID")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP"
          # DOS PAQUETES, LA MISMA APP.
          #
          # Compilar lo nativo cuesta un minuto; cambiar la web que lleva
          # dentro no cuesta nada. Así que se compila una vez y se relanza con
          # cada paquete: el de módulos (el que abre en blanco) y el clásico de
          # un solo archivo. La comparación, en el mismo aparato y el mismo
          # controlador, zanja si el remedio es ese.
          PUB=$(dirname "$(find "$APP" -name "index.html" -maxdepth 3 | head -1)")
          echo "la web va en $PUB"
          # El vigía tapa la app con su cartel a los 15 s si la web no le saluda,
          # así que hay que verla con él apagado: lo de abajo es la app, no un
          # fallo. Y con él encendido, para leer por dónde va el arranque.
          n=0
          for CFG in "app-clasico:" "app-clasico:vigia" "app-clasico:vigia,nativo,cortina"; do
            VAR=${CFG%%:*}; SIN=${CFG#*:}
            n=$((n+1))
            echo "=== $n) paquete $VAR ${SIN:+· sin $SIN} ==="
            xcrun simctl terminate "$UDID" do.com.fente.chinolareal 2>/dev/null || true
            sleep 2
            rm -rf "$PUB"/* && cp -R ../hibrido/$VAR/. "$PUB"/
            xcrun simctl uninstall "$UDID" do.com.fente.chinolareal 2>/dev/null || true
            xcrun simctl install "$UDID" "$APP"
            SIMCTL_CHILD_CN_SIN="$SIN" xcrun simctl launch "$UDID" do.com.fente.chinolareal || true
            sleep 22
            xcrun simctl io "$UDID" screenshot "$n-$VAR${SIN:+-sin-$SIN}.png" || true
          done

          echo "=== lo que dijo la web (y lo nativo) ==="
          xcrun simctl spawn "$UDID" log show --last 4m --style compact \
            --predicate 'process == "App" AND (eventMessage CONTAINS "CN" OR eventMessage CONTAINS "Chinola" OR eventMessage CONTAINS "rror")' 2>/dev/null | head -60 || true
          echo "=== ¿se hizo el reparenteo? ==="
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'eventMessage CONTAINS "CNRAIZ"' --style compact 2>/dev/null | head -5 || true
          echo "=== ¿sigue vivo el proceso? ==="
          xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i chinolareal || echo "(NO está vivo → crasheó)"
          echo "=== crash ==="
          find ~/Library/Logs/DiagnosticReports -name "App-*.ips" 2>/dev/null | sort | tail -1 | while read f; do sed -n '1,40p' "$f"; done

      - name: Subir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real
          path: app/*.png
