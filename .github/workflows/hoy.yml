name: "LA DE HOY: cinco arranques con el fallo ya arreglado"

# El otro banco de pruebas monta su propio `TestVC`: el controlador de verdad se
# compilaba pero nunca se ejecutaba. Y el fallo que perseguimos —la app abre en
# blanco— está justo en lo que ese controlador le hace al webview al arrancar.
#
# Aquí se ejecuta DE VERDAD, con una página mínima que dice en pantalla si su
# JavaScript llegó a correr. Nada del código web de Chinola: solo la pregunta.

on:
  workflow_dispatch:
  push:
    # Y la SIEMBRA y el fichero de ORO, que también deciden lo que pasa aquí.
    #
    # Faltaban: corregí el oro, lo empujé, y este banco —el único que lo
    # comprueba— no se despertó. Un camino que no despierta a quien lo
    # comprueba es un cambio que nadie mira.
    paths: ['hibrido/app-clasico/**', 'hibrido/overlay/**',
            'hibrido/siembra.js', 'hibrido/calculo-oro.json', 'hibrido/fusion-oro.json',
            'sondas/**', '.github/workflows/hoy.yml']

jobs:
  correr:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El Xcode por defecto de macos-15 es el 16.4 y no compila lo nativo de
      # Chinola, que usa cosas de iOS 26. El mismo paso que el otro banco.
      - name: Usar el Xcode más nuevo
        run: |
          NUEVO=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$NUEVO/Contents/Developer"
          xcodebuild -version

      - name: Montar la app con el controlador real
        run: |
          mkdir -p app/www && cd app
          # LA APP DE VERDAD, no una página de juguete. La de juguete ya dijo
          # lo que podía decir: con el controlador real sus módulos SÍ corren.
          # Lo que falta por saber es si la que abre en blanco en el teléfono
          # abre en blanco aquí — y si abre, su propio cartel dice por qué.
          cp -R ../hibrido/app-clasico/* www/
          # UNA LIBRETA DE EJEMPLO, solo aquí. Sin datos, lo único que se ve es
          # la bienvenida, y las pantallas que hay que mirar —las nativas, las
          # que tapan el webview— salen vacías porque no hay nada que pintar.
          cp ../hibrido/siembra.js www/siembra.js
          # Y EL FICHERO DE ORO, para poder ejecutar el Swift contra él. Va por
          # `www/` porque Capacitor mete esa carpeta entera en el paquete y así
          # no hay que tocar el proyecto de Xcode para añadir un recurso.
          cp ../hibrido/calculo-oro.json www/calculo-oro.json
          # Y el de la FUSIÓN, que lo genera otro guion: la capa de nube.
          cp ../hibrido/fusion-oro.json www/fusion-oro.json
          python3 - <<'PYX'
          import re, pathlib
          p = pathlib.Path('www/index.html')
          h = p.read_text()
          assert '<script defer src=' in h, 'no encontré el script de la app'
          h = h.replace('<script defer src=', '<script src="/siembra.js"></script>\n  <script defer src=', 1)
          p.write_text(h)
          print('siembra puesta antes del script de la app')
          PYX
          npm init -y >/dev/null
          # Los plugins DE VERDAD. Sin ellos el banco se inventa errores que la
          # app real no tiene («"App" plugin is not implemented on ios») y
          # ensucian justo lo que se viene a medir.
          npm i @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest \
            @capacitor/app @capacitor/status-bar @capacitor/keyboard @capacitor/splash-screen \
            @capacitor/haptics @capacitor/network @capacitor/share @capacitor/clipboard \
            @capacitor/filesystem @capacitor/local-notifications @capacitor/browser \
            @capacitor/preferences >/dev/null 2>&1
          # LA MISMA CONFIGURACIÓN QUE LA APP, no una de juguete.
          #
          # El banco traía la suya, mínima, y por eso no veía el fallo que de
          # verdad tenía el usuario: la app lleva `launchAutoHide` en la
          # pantalla de arranque, y el banco no. Con la de juguete el arranque
          # se quitaba solo y todo parecía ir bien; en el teléfono se quedaba
          # puesto, crema y liso, tapando la app entera. Un banco que no
          # reproduce la configuración no reproduce nada.
          cp ../hibrido/capacitor.config.json capacitor.config.json
          # La app sirve desde `nativo/` y el banco monta en `www/`. Es lo ÚNICO
          # que se le cambia a la configuración de la app: todo lo demás
          # —`launchAutoHide`, los ajustes del WebView— tiene que ser el mismo o
          # el banco no reproduce nada. Copiándola tal cual, Capacitor no
          # encontraba los ficheros y no llegaba ni a compilar.
          node -e "const f='capacitor.config.json';const c=require('./'+f);c.webDir='www';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          grep -q '\"webDir\": \"www\"' capacitor.config.json || { echo '::error::el webDir del banco no quedó puesto'; exit 1; }
          npx cap add ios
          npx cap sync ios

          # TODOS los Swift de la app, sin lista a mano.
          #
          # Este era el CUARTO banco con los nombres escritos. Los otros tres ya
          # se arreglaron y a este se me pasó: quedó con diecisiete de veinte, y
          # falló con «cannot find CNCatalogos in scope». No es un fallo de la
          # app — es del banco, y cuesta una vuelta entera averiguarlo.
          #
          # AppDelegate y SceneDelegate no se copian del overlay: los pone
          # Capacitor y el de escena lo manda el banco, que es el que quita el
          # storyboard.
          for f in ../hibrido/overlay/*.swift; do
            n=$(basename "$f")
            case "$n" in AppDelegate.swift|SceneDelegate.swift) continue;; esac
            cp "$f" "ios/App/App/$n"
          done
          cp -R ../hibrido/overlay/Fuentes ios/App/App/Fuentes
          cp ../hibrido/real/SceneDelegate.swift ios/App/App/SceneDelegate.swift
          echo "Swift de la app: $(ls ios/App/App/*.swift | wc -l | tr -d ' ')"

          gem install xcodeproj --no-document --quiet
          # Y al proyecto, los que estén: se leen del disco, no de una lista.
          ruby -e "
            require 'xcodeproj'
            p = Xcodeproj::Project.open('ios/App/App.xcodeproj')
            g = (p.main_group['App'] || p.main_group)
            t = p.targets.first
            ya = t.source_build_phase.files.map { |f| f.file_ref&.path }.compact
            Dir['ios/App/App/*.swift'].map { |f| File.basename(f) }.sort.each do |n|
              next if ya.include?(n)
              puts \"  + #{n}\"
              t.add_file_references([g.new_file(n)])
            end
            r = g.new_reference('Fuentes'); r.set_last_known_file_type('folder'); t.add_resources([r])
            p.save
          "
          # Sin storyboard: manda nuestro SceneDelegate, como en la app.
          RUTA=':UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneStoryboardFile'
          /usr/libexec/PlistBuddy -c "Delete $RUTA" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print $RUTA" ios/App/App/Info.plist 2>/dev/null \
            && { echo '::error::el storyboard sigue puesto'; exit 1; } || echo 'storyboard fuera ✓'
          /usr/libexec/PlistBuddy -c "Delete :UIMainStoryboardFile" ios/App/App/Info.plist 2>/dev/null || true

      - name: Compilar
        run: |
          set -o pipefail
          cd app
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcode.log | tail -25 || true
          # El `|| true` es para que lo de abajo LLEGUE A CORRER.
          #
          # Con `set -o pipefail` y `bash -e`, un xcodebuild que falla cortaba el
          # paso justo aquí, así que el bloque escrito para enseñar los errores
          # no se ejecutaba nunca: el banco decía «falló» y no decía dónde, que
          # es lo mismo que no decir nada y cuesta una vuelta entera averiguarlo.
          # El fallo no se traga: se mira abajo y se sale con 65.
          #
          # Y si falló, los errores DE VERDAD. `tail -25` se come justo lo que
          # hace falta —el motivo va mucho antes del resumen final— y eso
          # cuesta una vuelta entera de integración continua cada vez.
          if ! grep -q "BUILD SUCCEEDED" /tmp/xcode.log; then
            echo "=== los errores ==="
            grep -E "error:|error |failed|Failed" /tmp/xcode.log | head -40
            echo "=== y el final del log, por si el error no lleva la palabra ==="
            tail -60 /tmp/xcode.log
            cp /tmp/xcode.log xcode.log || true
            exit 65
          fi

      - name: Ejecutar y fotografiar
        run: |
          cd app
          APP=$(find build/Build/Products -name "App.app" -maxdepth 3 | head -1)
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "SimRuntime.iOS" in r["identifier"]]; rs.sort(key=lambda r:[int(n) for n in r["version"].split(".")]); print(rs[-1]["identifier"], rs[-1]["version"])')
          RT_ID=$(echo "$RT" | cut -d' ' -f1); RT_VER=$(echo "$RT" | cut -d' ' -f2)
          MODELO=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; ns=[d["name"] for d in json.load(sys.stdin)["devicetypes"]]; print(next((q for q in ["iPhone 17 Pro","iPhone 16 Pro","iPhone 16"] if q in ns), "iPhone 16 Pro"))')
          echo "iOS $RT_VER · $MODELO"
          xcrun simctl delete "real" 2>/dev/null || true
          UDID=$(xcrun simctl create "real" "$MODELO" "$RT_ID")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP"
          # El identificador, SACADO DE LA CONFIGURACIÓN y no escrito aquí.
          #
          # Estaba escrito a mano —`do.com.fente.chinolareal`— y dejó de ser el
          # suyo el día que la configuración pasó a ser la de la app. El
          # lanzamiento no encontraba nada, el `|| true` se tragaba el error, y
          # las capturas salieron siendo el ESCRITORIO del iPhone: los tres
          # bancos decían «success» sin haber mirado la app ni una vez.
          ID=$(node -p "require('./capacitor.config.json').appId")
          echo "identificador: $ID"
          # El escritorio, ANTES de arrancar. Es contra esto contra lo que se
          # comprueba luego que en las fotos salga la app.
          xcrun simctl io "$UDID" screenshot "cap-0-escritorio.png"
          # CINCO ARRANQUES SEGUIDOS.
          #
          # La de ayer, recompilada hoy, falló uno de cada tres: era una
          # carrera entre el puente de Capacitor y el montaje de la app. Con un
          # solo arranque no se demuestra que se haya acabado —podría tocar el
          # lado bueno de la ruleta—, así que van cinco.
          for n in 1 2 3 4 5; do
            echo "=== intento $n ==="
            xcrun simctl terminate "$UDID" "$ID" 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" "$ID"
            sleep 22
            xcrun simctl io "$UDID" screenshot "hoy-$n.png"
          done

          # Y AHORA, LAS PANTALLAS: UNA POR LANZAMIENTO.
          #
          # Con las cinco seguidas había que adivinar cuándo disparar cada foto
          # y salían cruzadas —«Cuentas» donde tocaba «Movimientos»—, que se
          # parece lo bastante a un fallo como para perder una hora. Una sola
          # pantalla por lanzamiento, quieta, no deja lugar a dudas.
          for P in resumen movs cuentas plan perfil; do
            echo "=== pantalla $P ==="
            xcrun simctl terminate "$UDID" "$ID" 2>/dev/null || true
            sleep 2
            env SIMCTL_CHILD_CN_IR=$P SIMCTL_CHILD_CN_CON=sonda,flota xcrun simctl launch "$UDID" "$ID"
            sleep 16
            xcrun simctl io "$UDID" screenshot "pestana-$P.png"
          done

          # UN SERVIDOR DE MENTIRA PARA EL TELÉFONO.
          #
          # La siembra reemplaza `window.fetch`, y eso solo intercepta a la WEB.
          # El teléfono usa `URLSession` y salía a internet de verdad con un vale
          # inventado: 401, y las tres subpantallas que hablan con el servidor
          # caían a la de la web. Lo peor no es que fallaran: es que NO fallaban.
          python3 ../sondas/api-de-mentira.py &
          sleep 2
          curl -s -o /dev/null -w "api de mentira: %{http_code}\n" \
            -H "authorization: Bearer x" http://127.0.0.1:8099/api/yo

          # Y LAS SUBPANTALLAS DE PERFIL, que son doce y no se fotografiaban
          # nunca: el banco solo sabía cambiar de pestaña. Todo lo que se
          # rompiera dentro —una lista vacía, un bloque que no se dibuja, unos
          # datos que nadie pidió— se quedaba sin ver.
          # LAS TRECE, no ocho. Las que falten no se miran nunca, que es
          # exactamente cómo se coló que «El icono de la app» abriera la web.
          # `organizar` no es una subpantalla de Perfil: es el panel en modo
          # organizar, que entra por el mismo camino. Se fotografía aquí porque
          # es donde están las fotos, y porque hasta ahora NADIE la había
          # fotografiado nunca —de ahí que el menú translúcido, los botones al
          # final de la lista y el título caído aguantaran tanto—.
          for P in cuenta seguridad dosPasos libretas integraciones panel cabecera menu letra colores dinero personaje icono-app organizar; do
            echo "=== perfil · $P ==="
            xcrun simctl terminate "$UDID" "$ID" 2>/dev/null || true
            sleep 2
            env SIMCTL_CHILD_CN_IR=perfil:$P SIMCTL_CHILD_CN_CON=sonda,flota \
              SIMCTL_CHILD_CN_API=http://127.0.0.1:8099 xcrun simctl launch "$UDID" "$ID"
            sleep 18
            xcrun simctl io "$UDID" screenshot "perfil-$P.png"
          done

          # ¿QUIÉN ARMÓ CADA SUBPANTALLA: el teléfono o la web?
          #
          # «Libretas y permisos» estuvo armándose en la web mientras la nativa
          # existía y devolvía nil por no tener datos. La pantalla salía IGUAL
          # DE BIEN: lo único que la delató fue un chip de más en una captura,
          # mirada por casualidad. Esto lo comprueba en vez de adivinarlo.
          echo "=== ¿quién armó cada subpantalla? ==="
          xcrun simctl spawn "$UDID" log show --last 6m --style compact \
            --predicate 'eventMessage CONTAINS "CNSECCION"' 2>/dev/null > /tmp/sec.txt || true
          python3 ../sondas/quien-armo-perfil.py /tmp/sec.txt \
            cuenta seguridad dosPasos libretas panel dinero menu letra cabecera colores icono-app

          # Y LAS HOJAS de Perfil, que se dibujan nativas y no se habían
          # fotografiado nunca: solo se abren tocando su fila.
          for H in perfil correo clave baja borrarLocal; do
            echo "=== hoja · $H ==="
            xcrun simctl terminate "$UDID" "$ID" 2>/dev/null || true
            sleep 2
            env SIMCTL_CHILD_CN_IR=perfil@$H SIMCTL_CHILD_CN_CON=sonda,flota \
              SIMCTL_CHILD_CN_API=http://127.0.0.1:8099 xcrun simctl launch "$UDID" "$ID"
            sleep 18
            xcrun simctl io "$UDID" screenshot "hoja-$H.png"
          done

          # ¿SALE LA APP EN LAS FOTOS, o es el escritorio? Las diez capturas de
          # este banco fueron el escritorio del iPhone y el banco pasaba.
          echo "=== ¿sale la app en las capturas? ==="
          for f in pestana-*.png hoy-*.png perfil-*.png hoja-*.png; do cp "$f" "cap-${f}"; done
          python3 ../sondas/hay-app-en-la-foto.py
          rm -f cap-pestana-*.png cap-hoy-*.png cap-perfil-*.png cap-hoja-*.png

          echo "=== lo que dijo la web (y lo nativo) ==="
          xcrun simctl spawn "$UDID" log show --last 4m --style compact \
            --predicate 'process == "App" AND (eventMessage CONTAINS "CNFLOTA2" OR eventMessage CONTAINS "CNSONDA" OR eventMessage CONTAINS "CNRELOJ" OR eventMessage CONTAINS "CN" OR eventMessage CONTAINS "Chinola" OR eventMessage CONTAINS "rror")' 2>/dev/null | head -60 || true
          # EL FICHERO DE ORO, EJECUTADO CONTRA EL SWIFT.
          #
          # El oro lo genera la web y una prueba en Node la ejecuta contra él.
          # Al Swift se le comprobaba leyendo su texto con expresiones
          # regulares, que confirman que el código dice lo que dice y no que la
          # cuenta salga bien. Aquí se ejecuta de verdad y se comparan los dos
          # árboles, número a número.
          echo "=== el oro contra el Swift ==="
          xcrun simctl terminate "$UDID" "$ID" 2>/dev/null || true
          sleep 2
          SIMCTL_CHILD_CN_ORO=1 xcrun simctl launch "$UDID" "$ID"
          sleep 14
          xcrun simctl spawn "$UDID" log show --last 2m --style compact \
            --predicate 'eventMessage CONTAINS "CNORO"' 2>/dev/null > /tmp/oro.txt || true
          python3 ../sondas/oro-cuadra.py www/calculo-oro.json www/fusion-oro.json /tmp/oro.txt

          # EL CICLO DE SINCRONIZACIÓN, ENTERO, contra el servidor de mentira.
          #
          # Es lo que de verdad ata la app al webview: hoy la libreta la baja, la
          # concilia y la sube la web. `CNNube` hace lo mismo en Swift y esto
          # comprueba que lo haga —que baje, que suba lo de los dos lados y que
          # rescate la libreta de llave vieja— y no solo que compile.
          #
          # No se enciende en el teléfono: mientras la web sincronice, serían dos
          # escritores de la misma libreta.
          echo "=== la sincronización nativa ==="
          xcrun simctl terminate "$UDID" "$ID" 2>/dev/null || true
          sleep 2
          SIMCTL_CHILD_CN_SINCRO=1 SIMCTL_CHILD_CN_API=http://127.0.0.1:8099 \
            xcrun simctl launch "$UDID" "$ID"
          sleep 16
          xcrun simctl spawn "$UDID" log show --last 2m --style compact \
            --predicate 'eventMessage CONTAINS "CNSINCRO" OR eventMessage CONTAINS "CNMANDO"' 2>/dev/null > /tmp/sincro.txt || true
          python3 ../sondas/sincro-cuadra.py /tmp/sincro.txt

          # ¿LA APP LLEGÓ A ENTRAR?
          #
          # La sonda dice el paso en cada arranque, y decía `"paso":"auth"` una
          # y otra vez sin que nadie lo mirara: la app se quedaba en la pantalla
          # de acceso y el banco fotografiaba pantallas vacías dando «success».
          # Un dato que el banco imprime y no comprueba es un dato que no
          # existe.
          xcrun simctl spawn "$UDID" log show --last 4m --style compact \
            --predicate 'eventMessage CONTAINS "CNSONDA"' 2>/dev/null > /tmp/sonda.txt || true
          if grep -q "CNSONDA" /tmp/sonda.txt; then
            if grep -q '"paso":"app"' /tmp/sonda.txt; then
              echo "la app entró ✓"
            else
              echo "::error::la app NO entró: $(grep -o '\"paso\":\"[a-z]*\"' /tmp/sonda.txt | sort -u | tr '\n' ' ')"
              exit 1
            fi
          else
            echo "(sin sonda: no se puede decir si entró)"
          fi

          echo "=== ¿se hizo el reparenteo? ==="
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'eventMessage CONTAINS "CNRAIZ"' --style compact 2>/dev/null | head -5 || true
          echo "=== ¿sigue vivo el proceso? ==="
          xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i "$ID" || echo "(NO está vivo → crasheó)"
          echo "=== crash ==="
          find ~/Library/Logs/DiagnosticReports -name "App-*.ips" 2>/dev/null | sort | tail -1 | while read f; do sed -n '1,40p' "$f"; done

      - name: Subir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoy
          path: |
            app/*.png
            app/xcode.log
