<div id="raiz"></div>
<!-- El fondo del tema, antes de que se cargue nada. El arranque pintaba el
     crema de la marca y, si el tema puesto era oscuro, la app daba un
     fogonazo claro antes de aparecer. Esto lee lo guardado y deja el fondo
     puesto en el primer pintado, que es lo que hace que abrir la app se
     parezca a abrir una app y no a cargar una página. -->
<script>
  (function () {
    var FONDOS = {
      sistema: '#f2f2f7', sistema_noche: '#000000',
      oceano: '#f2f5fb', menta: '#f0faf6', cacao: '#faf6f1', uva: '#f7f2fb',
      carbon: '#1e1f21', medianoche: '#1b1e2b', claro: '#fdfdfd', chinola: '#f9f7ee',
      semillas: '#faf7ec', jugo: '#fdf6e8', hoja: '#eff8f1', noche: '#171c18',
      noche_semillas: '#161b17', sombrio: '#121212', tinta: '#fbfbfb', niebla: '#f2f3f5',
      flor: '#f9f2fb', pulpa: '#fdf6e9', cascara: '#f4f9e9', arena: '#faf5ed',
      coral: '#fdf2f1', indigo: '#f2f3fc', salvia: '#f2f6f2', pizarra: '#f1f3f5',
      papel: '#faf7ef', chinola_noche: '#151b16', ciruela: '#1c141f', cafe_noche: '#1c1712',
      bosque: '#101710', tinta_azul: '#14161f', brasa: '#1d1412'
    };
    try {
      var j = JSON.parse(localStorage.getItem('chinola-sesion-v3') || 'null');
      var f = j && FONDOS[j.tema];
      if (f) {
        document.documentElement.style.background = f;
        document.body.style.background = f;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', f);
      }
    } catch (e) { /* modo privado: se queda el de la marca */ }
  })();
</script>
