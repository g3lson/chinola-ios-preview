<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chinola</title>
<!-- LA FORMA EXACTA QUE PRODUCE `scripts/nativo.mjs` DESPUÉS DEL ARREGLO:
     un script CLÁSICO y un solo archivo. Sin `type="module"` y sin trozos que
     pedir al vuelo. Si con esto la app arranca dentro del controlador real, el
     arreglo que ya está en main es el bueno. -->
<script src="/assets/app.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var d = document.createElement('div');
    d.setAttribute('style', 'padding:20px;background:#2f5bc4;color:#fff');
    d.textContent = 'EN LINEA: corrio';
    document.body.appendChild(d);
  });
</script>
</head>
<body style="margin:0;font:600 24px -apple-system,system-ui">
<div id="raiz"></div>
</body>
</html>
