<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chinola">
  <!-- EL PUNTO DE LA MARCA, el mismo que el icono de la app.
       Antes era una chinola cortada con siete semillas, dibujada aparte: a
       dieciséis píxeles las semillas son una mancha, y encima no se parecía al
       icono de la app. Dos marcas distintas según por dónde entres es media
       marca. Esto es lo mismo que `1d` en `src/iconos-app.js`, a mano porque un
       SVG de dieciséis píxeles no quiere degradados de más. -->
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="0.37" y2="1">
      <stop offset="0" stop-color="#ffe15c"/><stop offset="1" stop-color="#f5c000"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#f)"/>
  <circle cx="32" cy="32" r="18.6" fill="#17512f"/>
  <circle cx="32" cy="32" r="7" fill="#ffd426"/>
</svg>
