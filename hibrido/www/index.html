<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chinola Sim</title>
  <style>html,body{margin:0;min-height:100%;background:#f7f6ee;color:#111;font-family:-apple-system,system-ui,sans-serif;padding:60px 16px}
  h2{font-size:20px} pre{white-space:pre-wrap;word-break:break-word;font-size:13px}</style>
</head>
<body>
  <h2>Diagnóstico del puente</h2>
  <pre id="s">arrancando…</pre>
  <script>
    var LIBRETA = { nombre:"Personal", cuentas:[{id:1,nombre:"Cuenta",saldo:100,color:"#137d41",clase:"banco",icono:"banco"}],
      tx:[{id:"m1",concepto:"Sueldo",categoria:"Ingresos",tipo:"Ingreso",monto:30000,fecha:"2026-09-18",medio:"cuenta:1"}] };
    var log = [];
    function p(x){ log.push(x); document.getElementById('s').textContent = log.join('\n'); }
    p('Capacitor: ' + (typeof window.Capacitor));
    if (window.Capacitor) {
      p('isNativePlatform: ' + (window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()));
      p('registerPlugin: ' + (typeof window.Capacitor.registerPlugin));
      p('Plugins: ' + Object.keys(window.Capacitor.Plugins || {}).join(', '));
    }
    (async function(){
      try {
        var N = window.Capacitor.registerPlugin('Nativo');
        p('llamando Nativo.datos…');
        var r = await N.datos({ json: JSON.stringify(LIBRETA), perfil: '{}' });
        p('OK datos() resolvió: ' + JSON.stringify(r));
      } catch (e) {
        p('ERROR: ' + (e && e.message ? e.message : e));
      }
    })();
  </script>
</body>
</html>
