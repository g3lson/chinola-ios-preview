<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chinola Sim</title>
  <style>html,body{margin:0;min-height:100%;background:#f7f6ee;color:#111;font-family:-apple-system,system-ui,sans-serif;padding:60px 16px}
  h2{font-size:20px} pre{white-space:pre-wrap;word-break:break-word;font-size:13px}</style>
</head>
<body>
  <h2>Diagnóstico del puente</h2>
  <pre id="s">arrancando…</pre>
  <script>
    var LIBRETA = {
      nombre:"Casa",
      cuentas:[{id:1,nombre:"Cuenta de la casa",saldo:48200,color:"#137d41",clase:"banco",icono:"banco"}],
      categorias:[
        {nombre:"Salud",tipo:"Gasto",color:"#1fa9a0",icono:"salud"},
        {nombre:"Servicios",tipo:"Gasto",color:"#1fa9a0",icono:"rayo"},
        {nombre:"Educación",tipo:"Gasto",color:"#7a4fd0",icono:"birrete"},
        {nombre:"Ahorro",tipo:"Gasto",color:"#7a4fd0",icono:"hucha"}
      ],
      tx:[
        {id:"a",concepto:"Médico",categoria:"Salud",tipo:"Gasto Variable",monto:3700,fecha:"2026-09-07",medio:"cuenta:1"},
        {id:"b",concepto:"Agua y basura",categoria:"Servicios",tipo:"Gasto Fijo",monto:1800,fecha:"2026-09-06",medio:"cuenta:1",recurrente:true},
        {id:"c",concepto:"Aporte Remodelar la cocina",categoria:"Ahorro",tipo:"Ahorro",monto:8000,fecha:"2026-09-05",medio:"cuenta:1"},
        {id:"d",concepto:"Colegio de los niños",categoria:"Educación",tipo:"Gasto Fijo",monto:9000,fecha:"2026-09-05",medio:"cuenta:1",recurrente:true},
        {id:"e",concepto:"Aporte Remodelar la cocina",categoria:"Ahorro",tipo:"Ahorro",monto:8000,fecha:"2026-09-04",medio:"cuenta:1"},
        {id:"f",concepto:"Sueldo quincena",categoria:"Ingresos",tipo:"Ingreso",monto:30000,fecha:"2026-09-03",medio:"cuenta:1"}
      ]
    };
    var log = [];
    function p(x){ log.push(x); document.getElementById('s').textContent = log.join('\n'); }
    p('Capacitor: ' + (typeof window.Capacitor));
    if (window.Capacitor) {
      p('isNativePlatform: ' + (window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()));
      p('registerPlugin: ' + (typeof window.Capacitor.registerPlugin));
      p('Plugins: ' + Object.keys(window.Capacitor.Plugins || {}).join(', '));
    }
    (async function(){
      try {
        var N = window.Capacitor.Plugins.Nativo;   // el plugin YA está registrado
        p('llamando Nativo.datos…');
        var r = await N.datos({ json: JSON.stringify(LIBRETA), perfil: '{}' });
        p('OK datos() resolvió: ' + JSON.stringify(r));
      } catch (e) {
        p('ERROR: ' + (e && e.message ? e.message : e));
      }
    })();
  </script>
</body>
</html>
